name: mirror

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch shell from Vercel
        env:
          BASE: https://app.rainball.ru
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local file="$1" url="$2"
            local tmp="${file}.tmp"
            local code
            code=$(curl -sS --compressed --retry 3 --retry-delay 5 --max-time 90 \
                   -A 'rainball-mirror (github actions)' \
                   -H 'Cache-Control: no-cache' \
                   -o "$tmp" -w '%{http_code}' "$BASE$url") 2>/dev/null || true
            if [ "$code" != "200" ]; then echo "FAIL $url -> HTTP $code"; rm -f "$tmp"; return 1; fi
            if [ ! -s "$tmp" ]; then echo "FAIL $url -> empty body"; rm -f "$tmp"; return 1; fi
            mv "$tmp" "$file"
            echo "OK  $url -> $file ($(wc -c < "$file") bytes)"
          }
          fetch index.html    /
          fetch style.css     /style.css
          fetch sw.js         /sw.js
          fetch manifest.json /manifest.json
          fetch favicon.ico   /favicon.ico
          fetch logo.png      /logo.png
          fetch robots.txt    /robots.txt
          fetch sitemap.xml   /sitemap.xml
          cp -f index.html 404.html

      - name: Commit and push if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "mirror: sync from app.rainball.ru ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
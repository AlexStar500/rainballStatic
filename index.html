<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rainball</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%234facfe'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }
  #view {
    display: block;
    width: 100%;
    height: 100dvh;
    border: 0;
    background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    html, body, #view { background: #0b0e14; }
  }
</style>
</head>
<body>
<iframe id="view" title="Rainball" allow="autoplay; microphone; camera; clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
  const TARGET = 'https://rainball-psi.vercel.app/';
  const frame = document.getElementById('view');
  const q = new URLSearchParams(location.search).get('url');
  const target = !q ? TARGET : (/^https?:\/\//i.test(q) ? q : TARGET.replace(/\/+$/, '') + '/' + q.replace(/^\/+/, ''));

  frame.src = target;

  frame.addEventListener('error', () => {
    if (frame.src !== TARGET) frame.src = TARGET;
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rainball — поисковая система</title>
<meta name="description" content="Rainball — бесплатная поисковая система. Поиск по сайтам, картинкам, видео, картам и новостям. Встроенный переводчик, поддержка нескольких языков.">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }
  #view {
    display: block;
    width: 100%;
    height: 100dvh;
    border: 0;
    background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    html, body, #view { background: #0b0e14; }
  }
</style>
</head>
<body>
<iframe id="view" title="Rainball" allow="autoplay; microphone; camera; clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
  const TARGET = 'https://proxy.rainball.ru/';
  const frame = document.getElementById('view');
  const q = new URLSearchParams(location.search).get('url');
  const target = !q ? TARGET : (/^https?:\/\//i.test(q) ? q : TARGET.replace(/\/+$/, '') + '/' + q.replace(/^\/+/, ''));

  frame.src = target;

  frame.addEventListener('error', () => {
    if (frame.src !== TARGET) frame.src = TARGET;
  });
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Rainball — поисковая система</title>
<meta name="description" content="Rainball — бесплатная поисковая система. Поиск по сайтам, картинкам, видео, картам и новостям. Встроенный переводчик, поддержка нескольких языков.">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="logo.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #ffffff;
  }
  #view {
    display: block;
    width: 100%;
    height: 100dvh;
    border: 0;
    background: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    html, body, #view { background: #0b0e14; }
  }
</style>
</head>
<body>
<iframe id="view" title="Rainball" allow="autoplay; microphone; camera; clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
<script>
  const PRIMARY = 'https://proxy.rainball.ru/';
  const FALLBACK = 'https://app.rainball.ru/';
  const frame = document.getElementById('view');
  const q = new URLSearchParams(location.search).get('url');
  const isExternal = q && /^https?:\/\//i.test(q);

  let loaded = false;
  let switched = false;

  frame.addEventListener('load', () => { loaded = true; });

  function build(base) {
    if (!q) return base;
    return isExternal ? q : base.replace(/\/+$/, '') + '/' + q.replace(/^\/+/, '');
  }

  function go(base, allowFallback) {
    frame.src = build(base);
    if (!allowFallback) return;
    setTimeout(() => {
      if (!loaded && !switched) {
        switched = true;
        frame.src = build(FALLBACK);
      }
    }, 8000);
  }

  if (isExternal) {
    go(PRIMARY, false);
  } else {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 4000);
    fetch(PRIMARY, { method: 'HEAD', mode: 'no-cors', cache: 'no-store', signal: ctl.signal })
      .then(() => { clearTimeout(timer); go(PRIMARY, true); })
      .catch(() => { clearTimeout(timer); go(FALLBACK, false); });
  }
</script>
</body>
</html>

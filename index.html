        function render() {
            const modal = document.getElementById('authModal');
            if (modal) modal.style.display = 'none';
            const app = document.getElementById('app');
            const path = window.location.pathname;
            if (path === '/' || path === '') {
                const params = new URLSearchParams(window.location.search);
                const isOAuth = params.get('oauth') === '1';
                const isLogin = params.get('login') === '1';
                if (isOAuth) {
                    app.innerHTML = oauthHTML();
                    setTimeout(initOAuth, 0);
                } else if (isLogin) {
                    if (authUser) { window.location.href = '/'; return; }
                    app.innerHTML = loginPageHTML();
                    setTimeout(initLoginPage, 0);
                } else {
                    app.innerHTML = homeHTML();
                }
            }
            else if (path.startsWith('/search')) {
                const p = new URLSearchParams(window.location.search);
                currentQuery = p.get('q') || '';
                currentType = p.get('type') || 'all';
                app.innerHTML = searchHTML();
                if (currentQuery) doSearch();
            } else if (path === '/translator') {
                app.innerHTML = translatorHTML();
                setTimeout(initTranslator, 0);
            } else if (path === '/dev') {
                app.innerHTML = devHTML();
                setTimeout(initDev, 0);
            } else if (path.startsWith('/profile')) {
                const p = new URLSearchParams(window.location.search);
                const uid = p.get('id') || (authUser ? authUser.id : '');
                app.innerHTML = profileHTML(uid);
                if (uid) setTimeout(() => initProfile(uid), 0);
            } else if (path === '/privacy') {
                app.innerHTML = privacyHTML();
            } else if (path === '/history') {
                app.innerHTML = historyHTML();
                setTimeout(initHistory, 0);
            } else if (path === '/admin') {
                if (!authUser || authUser.email !== 'aleshkalarin2002@gmail.com') {
                    app.innerHTML = `<div style="text-align:center;padding:40px;color:#8b949e">Доступ запрещён</div>`;
                } else {
                    app.innerHTML = adminHTML();
                    setTimeout(initAdmin, 0);
                }
            }
            attachEvents();
        }

            ).join('');

        function initTranslator() {
            const srcText = document.getElementById('srcText');
            const tgtText = document.getElementById('tgtText');
            const srcLang = document.getElementById('srcLang');
            const tgtLang = document.getElementById('tgtLang');
            const translateBtn = document.getElementById('translateBtn');
            const swapBtn = document.getElementById('swapBtn');
            const status = document.getElementById('translateStatus');
            const charCount = document.getElementById('charCount');
            const meta = document.getElementById('transMeta');

            function updateCharCount() {
                const len = srcText.value.length;
                charCount.textContent = len;
                charCount.style.color = len > 5000 ? '#ff4b5c' : len > 3000 ? '#ffa657' : '#8b949e';
            }

            async function doTranslate() {
                const text = srcText.value.trim();

                    const res = await fetch(`/api/translate?text=${encodeURIComponent(text)}&to=${tl}${sl !== 'auto' ? `&sl=${sl}` : ''}`);
                    const data = await res.json();
                    const translated = data.translated || text;
                    tgtText.value = translated;
                    if (data.detectedSrcLang && sl === 'auto') {

                        }
                    }
                    status.textContent = '';
                } catch {
                    status.textContent = 'Error';
                }
                _translating = false;
                translateBtn.disabled = false;
            }

            srcText.addEventListener('input', updateCharCount);
            srcText.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') doTranslate();
            });
            translateBtn.addEventListener('click', doTranslate);

                tgtLang.value = srcCode;

                srcText.value = tgtText.value;
                tgtText.value = tmp;

                meta.innerHTML = '';
                status.textContent = '';
            });

        async function authorizeApp() {
            const params = new URLSearchParams(window.location.search);
            const clientId = params.get('client_id');
            const redirectUri = params.get('redirect_uri');
            if (!clientId || !redirectUri) return;
            const selectedId = _oauthSelectedId || (authUser ? authUser.id : null);
            const saved = selectedId ? savedAccounts.find(a => a.id === selectedId) : null;
            const token = saved ? saved.token : authToken;
            if (!token) return;
            document.cookie = `oauth_token=${token};path=/;max-age=300;samesite=lax`;
            let challenge = params.get('code_challenge') || '';
            let challengeMethod = params.get('code_challenge_method') || '';
            if (!challenge) {
                const verifier = genCodeVerifier();
                challenge = genCodeChallenge(verifier);
                challengeMethod = 'S256';
                sessionStorage.setItem('oauth_code_verifier', verifier);
            }
            window.location.href = `${API_BASE}/api/oauth/authorize?confirm=1&client_id=${encodeURIComponent(clientId)}&redirect_uri=${encodeURIComponent(redirectUri)}&code_challenge=${encodeURIComponent(challenge)}&code_challenge_method=${encodeURIComponent(challengeMethod)}`;
        }

        function cancelOAuth() {
            window.history.back();
        }

        // PKCE helpers (SHA-256 via Web Crypto API)
        function genCodeVerifier() {
            const arr = new Uint8Array(32);
            crypto.getRandomValues(arr);
            return btoa(String.fromCharCode(...arr)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function genCodeChallenge(verifier) {
            const enc = new TextEncoder();
            const hash = await crypto.subtle.digest('SHA-256', enc.encode(verifier));
            return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        async function authPost(path, body) {
            const ctl = new AbortController();
            const to = setTimeout(() => ctl.abort(), 15000);
            try {
                const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify(body), signal: ctl.signal });
                const text = await res.text();
                let data = {}; try { data = JSON.parse(text); } catch {}
                return { status: res.status, data };
            } finally { clearTimeout(to); }
        }

            authToken = data.token;
            authUser = data.user;
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('auth_user', JSON.stringify(data.user));
            saveAccount({ id: data.user.id, username: data.user.username, email: data.user.email, avatar_emoji: data.user.avatar_emoji, avatar_gradient: data.user.avatar_gradient, token: data.token });
            window.location.href = '/';

            if (btn && btn.disabled) return;
            if (btn) { btn.disabled = true; btn.textContent = '...'; }
            try {

                for (let i = 0; i < 2; i++) { try { r = await authPost('/api/auth/login', { email, password }); break; } catch (e) { r = null; } }
                if (!r) { errEl.textContent = 'Error'; return; }

        async function doLoginPageRegister() {
            const username = document.getElementById('loginPageUsername').value;
            const email = document.getElementById('loginPageRegEmail').value;
            const password = document.getElementById('loginPageRegPassword').value;
            const backup_word = document.getElementById('loginPageBackup').value;
            const errEl = document.getElementById('loginPageRegError');
            const btn = document.querySelector('#registerFormContainer .oauth-btn-primary');
            if (!username || !email || !password) { errEl.textContent = 'Fill all fields'; return; }
            if (btn && btn.disabled) return;
            if (btn) { btn.disabled = true; btn.textContent = '...'; }
            try {
                let r = null;
                for (let i = 0; i < 2; i++) { try { r = await authPost('/api/auth/register', { username, email, password, backup_word }); break; } catch (e) { r = null; } }
                if (!r) { errEl.textContent = 'Error'; return; }
                if (r.data.error === 'Email already registered') {
                    const lr = await authPost('/api/auth/login', { email, password }).catch(() => null);
                    if (lr && lr.status === 200 && lr.data.token && lr.data.user) { authFinish(lr.data); return; }
                    errEl.textContent = t.user_exists; return;
                }
                if (r.status !== 200 || !r.data.token || !r.data.user) { errEl.textContent = (r.data && r.data.error) || 'Error'; return; }
                authFinish(r.data);
            } catch { errEl.textContent = 'Error'; }

        // Игра Змейка
        function startSnakeGame() {
            const results = document.getElementById('results');
            results.innerHTML = `<div class="snake-game"><canvas id="snakeCanvas" width="400" height="400"></canvas><p>${t.snake_controls}</p><div class="snake-btns"><button class="snake-btn" data-dir="up">↑</button><div><button class="snake-btn" data-dir="left">←</button><button class="snake-btn snake-restart" data-dir="space">⟳</button><button class="snake-btn" data-dir="right">→</button></div><button class="snake-btn" data-dir="down">↓</button></div></div>`;
            const canvas = document.getElementById('snakeCanvas');
            const ctx = canvas.getContext('2d');
            let snake = [{x: 200, y: 200}], direction = {x: 1, y: 0}, food = {}, score = 0, gameLoop;
            function randomFood() {
                food = {x: Math.floor(Math.random()*40)*10, y: Math.floor(Math.random()*40)*10};
                if (snake.some(s => s.x === food.x && s.y === food.y)) randomFood();
            }
            function gameOver() {
                clearInterval(gameLoop);
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, 400, 400);
                ctx.fillStyle = 'white'; ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(t.snake_game_over, 200, 170);
                ctx.font = '18px sans-serif';
                ctx.fillText(t.snake_score + score, 200, 210);
                ctx.font = '14px sans-serif';
                ctx.fillStyle = '#8b949e';
                ctx.fillText(t.snake_restart, 200, 250);
                ctx.textAlign = 'start';
            }
            function drawRoundRect(x, y, w, h, r) {
                ctx.beginPath();
                ctx.moveTo(x + r, y);
                ctx.lineTo(x + w - r, y);
                ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                ctx.lineTo(x + w, y + h - r);
                ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                ctx.lineTo(x + r, y + h);
                ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                ctx.lineTo(x, y + r);
                ctx.quadraticCurveTo(x, y, x + r, y);
                ctx.closePath();
            }
            function drawSnake() {
                for (let i = snake.length - 1; i >= 0; i--) {
                    const s = snake[i];
                    const t = i / Math.max(snake.length - 1, 1);
                    const r = 5;
                    const pad = i === 0 ? 0 : 1;
                    const size = i === 0 ? 10 : 10 - pad * 2;
                    const x = s.x + (i === 0 ? 0 : pad);
                    const y = s.y + (i === 0 ? 0 : pad);
                    const grad = ctx.createRadialGradient(x + 5, y + 5, 0, x + 5, y + 5, 7);
                    if (i === 0) {
                        grad.addColorStop(0, '#6dd5fa');
                        grad.addColorStop(1, '#2980b9');
                    } else {
                        const bright = Math.round(60 + t * 40);
                        const g = Math.round(180 + t * 40);
                        grad.addColorStop(0, `rgb(${bright}, ${g}, 240)`);
                        grad.addColorStop(1, `rgb(${Math.round(bright*0.6)}, ${Math.round(g*0.6)}, 200)`);
                    }
                    ctx.fillStyle = grad;
                    drawRoundRect(x, y, size, size, r);
                    ctx.fill();
                    if (i === 0) {
                        ctx.fillStyle = 'white';
                        const ex = direction.x === 1 ? 7 : direction.x === -1 ? 3 : 5;
                        const ey = direction.y === 1 ? 7 : direction.y === -1 ? 3 : 5;
                        ctx.beginPath();
                        ctx.arc(s.x + ex - 1, s.y + ey - 1, 2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.arc(s.x + ex + 3, s.y + ey - 1, 2, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
            function drawFood() {
                const cx = food.x + 5, cy = food.y + 5;
                const grad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, 7);
                grad.addColorStop(0, '#ff6b6b');
                grad.addColorStop(0.7, '#ee2a2a');
                grad.addColorStop(1, '#a00000');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(cx - 0.5, cy - 7, 1, 4);
                ctx.fillRect(cx - 2, cy - 5, 4, 2);
            }
            function update() {
                const head = {x: snake[0].x + direction.x * 10, y: snake[0].y + direction.y * 10};
                if (head.x < 0 || head.x >= 400 || head.y < 0 || head.y >= 400) { gameOver(); return; }
                if (snake.some(s => s.x === head.x && s.y === head.y)) { gameOver(); return; }
                snake.unshift(head);
                if (head.x === food.x && head.y === food.y) { score++; randomFood(); }
                else { snake.pop(); }
                ctx.clearRect(0, 0, 400, 400);
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                for (let i = 0; i < 40; i++) {
                    ctx.fillRect(i * 10, 0, 1, 400);
                    ctx.fillRect(0, i * 10, 400, 1);
                }
                drawFood();
                drawSnake();
                ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText(t.snake_score + score, 10, 22);
            }
            randomFood();
            gameLoop = setInterval(update, 100);
            window.addEventListener('keydown', (e) => {
                const code = e.code;
                if (code === 'ArrowUp' || code === 'KeyW') { if (direction.y === 0) direction = {x: 0, y: -1}; }
                else if (code === 'ArrowDown' || code === 'KeyS') { if (direction.y === 0) direction = {x: 0, y: 1}; }
                else if (code === 'ArrowLeft' || code === 'KeyA') { if (direction.x === 0) direction = {x: -1, y: 0}; }
                else if (code === 'ArrowRight' || code === 'KeyD') { if (direction.x === 0) direction = {x: 1, y: 0}; }
                else if (code === 'Space') {
                    clearInterval(gameLoop);
                    snake = [{x: 200, y: 200}]; direction = {x: 1, y: 0}; score = 0;
                    randomFood();
                    gameLoop = setInterval(update, 100);
                }
            });
            document.querySelectorAll('.snake-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const dir = btn.dataset.dir;
                    if (dir === 'up' && direction.y === 0) direction = {x: 0, y: -1};
                    else if (dir === 'down' && direction.y === 0) direction = {x: 0, y: 1};
                    else if (dir === 'left' && direction.x === 0) direction = {x: -1, y: 0};
                    else if (dir === 'right' && direction.x === 0) direction = {x: 1, y: 0};
                    else if (dir === 'space') {
                        clearInterval(gameLoop);
                        snake = [{x: 200, y: 200}]; direction = {x: 1, y: 0}; score = 0;
                        randomFood();
                        gameLoop = setInterval(update, 100);
                    }
                });
            });
        }

        function renderVideos(videos) {
            const el = document.getElementById('results');
            if (!Array.isArray(videos) || !videos.length) {

                return;

        function showNextVideos() {
            const list = document.getElementById('videosList');
            if (!list) return;
            const start = _videoPage * VIDEO_PAGE_SIZE;
            const chunk = _allVideos.slice(start, start + VIDEO_PAGE_SIZE);
            if (!chunk.length) return;
            chunk.forEach(v => { if (v) list.insertAdjacentHTML('beforeend', videoItemHTML(v)); });
            _videoPage++;
            watchVideoScroll();
        }

        function watchVideoScroll() {
            if (_videoObserver) _videoObserver.disconnect();
            if (_videoPage * VIDEO_PAGE_SIZE >= _allVideos.length) return;
            const sentinel = document.getElementById('videoSentinel');
            if (!sentinel) return;
            _videoObserver = new IntersectionObserver(([entry]) => {
                if (entry.isIntersecting) {
                    _videoObserver.disconnect();
                    _videoObserver = null;
                    showNextVideos();
                }
            }, { rootMargin: '300px' });
            _videoObserver.observe(sentinel);
        }

            data.forEach((item, idx) => {
                const addr = item.address ? [item.address.road, item.address.city, item.address.country].filter(Boolean).join(', ') : item.displayName;
                list.insertAdjacentHTML('beforeend', `<div class="map-result-item" data-idx="${idx}">

                </div>`);
            });
            setTimeout(() => {
                if (_mapInstance) _mapInstance.remove();
                _mapInstance = L.map('map', { zoomControl: true }).setView([data[0].lat, data[0].lon], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '© OpenStreetMap'
                }).addTo(_mapInstance);
                const bounds = [];
                data.forEach((item, idx) => {
                    const marker = L.marker([item.lat, item.lon]).addTo(_mapInstance);
                    marker.bindPopup(`<b>${escapeHtml(item.title.split(',')[0])}</b><br>${escapeHtml(item.displayName)}`);
                    marker.on('click', () => {
                        document.querySelectorAll('.map-result-item').forEach(r => r.classList.remove('active'));
                        document.querySelector(`.map-result-item[data-idx="${idx}"]`)?.classList.add('active');
                    });
                    bounds.push([item.lat, item.lon]);
                });
                if (bounds.length > 1) _mapInstance.fitBounds(bounds, { padding: [30, 30] });
                document.querySelectorAll('.map-result-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const idx = parseInt(el.dataset.idx);
                        const item = data[idx];
                        _mapInstance.setView([item.lat, item.lon], 15);
                        document.querySelectorAll('.map-result-item').forEach(r => r.classList.remove('active'));
                        el.classList.add('active');
                    });
                });
            }, 100);
        }

        async function doSearch(append = false) {
            if (isLoading) return;
            isLoading = true;
            if (!append) {
                document.getElementById('instantAnswer').innerHTML = '';
                if (currentType === 'videos') document.getElementById('results').innerHTML = skeletonVideosHTML(6);
                else if (currentType === 'images') document.getElementById('results').innerHTML = skeletonImagesHTML(12);
                else if (currentType === 'maps') document.getElementById('results').innerHTML = skeletonMapsHTML(6);
                else if (currentType === 'news') document.getElementById('results').innerHTML = skeletonNewsHTML(6);
                else document.getElementById('results').innerHTML = skeletonAllHTML(5);
            }
            const lm = document.getElementById('loadMore');
            if (lm) lm.style.display = 'none';
            if (currentType === 'videos') {
                currentPage = 1;
                const res = await fetch(`/api/videos?q=${encodeURIComponent(currentQuery)}`);
                const videos = await res.json();
                renderVideos(videos);
                isLoading = false;
                addToHistory(currentQuery);
                return;
            } else if (currentType === 'images') {
                const res = await fetch(`/api/images?q=${encodeURIComponent(currentQuery)}`);
                const images = await res.json();
                document.getElementById('results').innerHTML = renderImages(images);
            } else if (currentType === 'maps') {
                const res = await fetch(`/api/maps?q=${encodeURIComponent(currentQuery)}`);
                const data = await res.json();
                renderMaps(data);
            } else if (currentType === 'news') {
                const res = await fetch(`/api/news?q=${encodeURIComponent(currentQuery)}`);
                const data = await res.json();
                document.getElementById('results').innerHTML = renderNews(data);
            } else {
                const page = append ? ++currentPage : (currentPage = 1);
                const res = await fetch(`/api/search?q=${encodeURIComponent(currentQuery)}&page=${page}`);
                const data = await res.json();
                if (data.game === 'snake') {
                    startSnakeGame();
                    isLoading = false;
                    return;
                }
                if (!append) document.getElementById('instantAnswer').innerHTML = renderInstant(data.instant);
                const html = renderResults(data.results);
                if (append) {
                    document.getElementById('results').insertAdjacentHTML('beforeend', html);
                } else {
                    document.getElementById('results').innerHTML = html;
                }
                if (data.results.length > 0 && lm && currentType === 'all') lm.style.display = 'block';
            }
            isLoading = false;
            addToHistory(currentQuery);
        }

        function loadMore() {
            doSearch(true);
        }

        function navigateToSearch(query) {
            if (_videoObserver) { _videoObserver.disconnect(); _videoObserver = null; }
            window.history.pushState({}, '', `/search?q=${encodeURIComponent(query)}&type=${currentType}`);
            currentQuery = query; currentPage = 1;
            document.getElementById('app').innerHTML = searchHTML();
            attachEvents();
            setTimeout(doSearch, 0);
        }

        // Подсказки
        async function fetchSuggestions(query) {
            const sugBox = document.getElementById('suggestions');
            if (!sugBox) return;
            if (query.length < 2) { sugBox.style.display = 'none'; return; }
            const res = await fetch(`/api/suggest?q=${encodeURIComponent(query)}`);
            const list = await res.json();
            if (list.length === 0) { sugBox.style.display = 'none'; return; }
            sugBox.innerHTML = list.map(s => `<div class="suggestion-item">${escapeHtml(s)}</div>`).join('');
            sugBox.style.display = 'block';
        }

        function showHistoryDropdown() {
            const input = document.getElementById('searchInput');
            const dropdown = document.getElementById('historyDropdown');
            if (!input || !dropdown) return;
            const val = input.value.trim();
            if (val || incognito || history.length === 0) {
                dropdown.style.display = 'none';
                return;
            }
            dropdown.innerHTML = history.map((q, i) => `
                <div class="history-item">
                    <span class="history-query" onclick="event.stopPropagation(); document.getElementById('searchInput').value='${escapeHtml(q)}'; navigateToSearch('${escapeHtml(q)}')">${escapeHtml(q)}</span>
                    <span class="history-delete" onclick="event.stopPropagation(); removeHistoryItem(${i})">✕</span>
                </div>
            `).join('');
            dropdown.style.display = 'block';
        }

        function attachEvents() {
            const input = document.getElementById('searchInput');
            // Подсказки (c debounce)
            const debouncedSuggest = debounce(fetchSuggestions, 250);
            input?.addEventListener('input', function() {
                debouncedSuggest(this.value);
                if (!this.value.trim()) showHistoryDropdown();
                else { const dd = document.getElementById('historyDropdown'); if (dd) dd.style.display = 'none'; }
            });
            input?.addEventListener('focus', function() {
                if (!this.value.trim()) showHistoryDropdown();
            });
            input?.addEventListener('keydown', e => {
                if (e.key === 'Enter' && e.target.value.trim()) {
                    document.getElementById('suggestions').style.display = 'none';
                    navigateToSearch(e.target.value.trim());
                }
            });
            document.getElementById('searchBtn')?.addEventListener('click', () => {
                const v = document.getElementById('searchInput').value.trim();
                if (v) { document.getElementById('suggestions').style.display = 'none'; navigateToSearch(v); }
            });

            // Скрытие подсказок и истории при клике вне
            document.addEventListener('click', e => {
                const sug = document.getElementById('suggestions');
                const inp = document.getElementById('searchInput');
                const dd = document.getElementById('historyDropdown');
                if (sug && inp && !inp.contains(e.target) && !sug.contains(e.target)) sug.style.display = 'none';
                if (dd && inp && !inp.contains(e.target) && !dd.contains(e.target)) dd.style.display = 'none';
            });

            // Клик по подсказке
            document.getElementById('suggestions')?.addEventListener('click', e => {
                if (e.target.classList.contains('suggestion-item')) {
                    const val = e.target.textContent;
                    document.getElementById('searchInput').value = val;
                    document.getElementById('suggestions').style.display = 'none';
                    navigateToSearch(val);
                }
            });

            // Кнопки перевода — делегирование на document
            // (вешается один раз при старте)
            if (!window._translateListener) {
                document.addEventListener('click', function(e) {
                    const btn = e.target.closest('.translate-btn');
                    if (btn) toggleTranslation(btn);
                });
                window._translateListener = true;
            }
        }

        async function doLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const errEl = document.getElementById('authError');
            if (!email || !password) { errEl.textContent = 'Fill all fields'; return; }
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (!res.ok) { errEl.textContent = t.wrong_creds; return; }
                const sp = new URLSearchParams(window.location.search);
                const isOAuth = sp.get('oauth') === '1';
                const isLogin = sp.get('login') === '1';
                saveAccount({ id: data.user.id, username: data.user.username, email: data.user.email, avatar_emoji: data.user.avatar_emoji, avatar_gradient: data.user.avatar_gradient, token: data.token });
                if (isOAuth) {
                    _oauthSelectedId = data.user.id;
                    document.getElementById('authModal').style.display = 'none';
                    render();
                    return;
                }
                authToken = data.token;
                authUser = data.user;
                localStorage.setItem('auth_token', data.token);
                localStorage.setItem('auth_user', JSON.stringify(data.user));
                document.getElementById('authModal').style.display = 'none';
                if (isLogin) { window.location.href = '/'; return; }
                render();
            } catch { errEl.textContent = 'Error'; }
        }

        function saveAccount(account) {
            savedAccounts = savedAccounts.filter(a => a.id !== account.id);
            savedAccounts.unshift({
                id: account.id, username: account.username, email: account.email,
                avatar_emoji: account.avatar_emoji || '😀',
                avatar_gradient: account.avatar_gradient || 'linear-gradient(135deg,#4facfe,#00f2fe)',
                token: account.token
            });
            if (savedAccounts.length > 5) savedAccounts.pop();
            localStorage.setItem('saved_accounts', JSON.stringify(savedAccounts));
        }

        function forgetAccount(accountId) {
            savedAccounts = savedAccounts.filter(a => a.id !== accountId);
            localStorage.setItem('saved_accounts', JSON.stringify(savedAccounts));

        }

            authToken = account.token;
            authUser = {

            };
            localStorage.setItem('auth_token', account.token);
            localStorage.setItem('auth_user', JSON.stringify(authUser));
            saveAccount(account);
            render();
        }

        function toggleBingSA() {

        function bingsaAddMessage(role, content, sources) {
            const container = document.getElementById('bingsaMessages');

            const div = document.createElement('div');
            div.className = 'bingsa-msg ' + role;
            div.innerHTML = '<div class="bingsa-msg-content">' + escapeHtml(content).replace(/\n/g, '<br>') + '</div>';

        function bingsaRenderSources(sources) {
            const container = document.getElementById('bingsaSources');
            const list = document.getElementById('bingsaSourcesList');

            if (!sources || sources.length === 0) {

        async function bingsaAsk() {
            const input = document.getElementById('bingsaInput');
            if (!input || _bingsaLoading) return;
            const query = input.value.trim();
            if (!query) return;
            input.value = '';
            bingsaAddMessage('user', query);
            _bingsaLoading = true;
            try {
                const res = await fetch('/api/bingsa/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ query })
                });
                const data = await res.json();
                if (data.error) {
                    bingsaAddMessage('assistant', 'Ошибка: ' + (data.detail || data.error));
                    return;
                }
                bingsaAddMessage('assistant', data.response);
                bingsaRenderSources(data.sources);
                _bingsaLastQuery = query;
                _bingsaLastSources = data.sources || [];
                _bingsaLastAnswer = data.response;
                _bingsaLastTrained = data.trained;
                _bingsaLastTrainedId = data.trainedId;
                const trainBtn = document.getElementById('bingsaTrainBtn');
                if (trainBtn) {
                    trainBtn.style.display = data.trained ? 'none' : 'inline-block';
                }
            } catch (e) {
                bingsaAddMessage('assistant', 'Ошибка соединения');
            }
            _bingsaLoading = false;
        }

        async function bingsaTrain() {
            if (!_bingsaLastQuery) return;
            const cbs = document.querySelectorAll('.bingsa-source-cb:checked');
            const selectedUrls = Array.from(cbs).map(cb => cb.value);
            const selectedSources = _bingsaLastSources.filter(s => selectedUrls.includes(s.url));
            const answers = _bingsaLastAnswers.length > 0 ? _bingsaLastAnswers : (_bingsaLastAnswer ? [{url: _bingsaLastAnswer, title: _bingsaLastAnswer, snippet: ''}] : []);
            let lastOk = false;
            for (const a of answers) {
                try {
                    const res = await fetch('/api/bingsa/train', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                        body: JSON.stringify({
                            query: _bingsaLastQuery,
                            answer: a.url,
                            sources: selectedSources.length > 0 ? selectedSources : _bingsaLastSources
                        })
                    });
                    const data = await res.json();
                    if (data.ok) lastOk = true;
                } catch {}
            }
            if (lastOk) {
                bingsaAddMessage('assistant', '✅ Ответы запомнены! При следующем запросе «' + _bingsaLastQuery + '» я сразу отвечу сохранёнными.');
                document.getElementById('bingsaTrainBtn').style.display = 'none';
            }
        }

        async function bingsaRegenerate() {
            if (_bingsaLoading) return;
            const cbs = document.querySelectorAll('.bingsa-source-cb:checked');
            const selectedUrls = Array.from(cbs).map(cb => cb.value);
            _bingsaLoading = true;
            try {
                const res = await fetch('/api/bingsa/regenerate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ selectedUrls, query: _bingsaLastQuery })
                });
                const data = await res.json();
                if (data.error) {
                    bingsaAddMessage('assistant', 'Ошибка: ' + (data.detail || data.error));
                    return;
                }
                bingsaAddMessage('assistant', data.response);
                bingsaRenderSources(data.sources);
            } catch {
                bingsaAddMessage('assistant', 'Ошибка соединения');
            }
            _bingsaLoading = false;
        }

        async function bingsaSetAnswer() {
            const input = document.getElementById('bingsaAnswerInput');
            if (!input) return;
            let answer = input.value.trim();
            if (!answer) return;
            if (!answer.startsWith('http://') && !answer.startsWith('https://')) {
                answer = 'https://' + answer;
            }
            input.value = '';
            if (!_bingsaLastAnswers) _bingsaLastAnswers = [];
            if (_bingsaLastAnswers.find(a => a.url === answer)) {
                bingsaAddMessage('assistant', '⚠️ Этот URL уже добавлен.');
                return;
            }
            _bingsaLastAnswers.push({ url: answer, title: answer, snippet: '' });
            _bingsaLastAnswer = answer;
            const answerList = _bingsaLastAnswers.map((a, i) =>
                `${i+1}. <a href="${a.url}" target="_blank" style="color:#58a6ff">${a.title}</a>`
            ).join('<br>');
            bingsaAddMessage('assistant', `✅ Добавлен URL: ${answer}<br><br><b>Все ответы:</b><br>${answerList}<br><br>Нажми «💾 Запомнить», чтобы при запросе «${_bingsaLastQuery}» выдавать эти сайты первыми.`);
            const trainBtn = document.getElementById('bingsaTrainBtn');
            if (trainBtn) trainBtn.style.display = 'inline-block';
        }

        async function bingsaClear() {
            try {
                await fetch('/api/bingsa/clear', {
                    method: 'POST',

        async function loadTrainedBingSA() {

                });

                if (!data.trained || data.trained.length === 0) {
                    list.innerHTML = '<p style="color:#8b949e">Нет тренированных ответов</p>';
                    return;
                }
                list.innerHTML = data.trained.map(t => `
                    <div class="key-item" style="flex-direction:column;align-items:stretch">
                        <div class="key-info">
                            <strong>${escapeHtml(t.query)}</strong>
                            <div style="font-size:12px;color:#484f58;margin:4px 0">
                                Ответов: ${(t.answers || []).length} · ${new Date(t.trained_at).toLocaleString()}
                            </div>
                            <div style="margin-top:4px">
                                ${(t.answers || []).map((a, i) => `
                                    <div style="display:flex;align-items:center;gap:4px;margin:2px 0;font-size:12px">
                                        <span style="color:#8b949e;min-width:16px">${i+1}.</span>
                                        <a href="${escapeHtml(a.url)}" target="_blank" style="color:#58a6ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;display:inline-block">${escapeHtml(a.title || a.url)}</a>
                                        <button class="key-delete" style="padding:2px 6px;font-size:11px" onclick="reorderAnswer('${t.id}','${escapeHtml(a.url).replace(/'/g,"\\'")}',-1)" ${i===0?'disabled':''}>↑</button>
                                        <button class="key-delete" style="padding:2px 6px;font-size:11px" onclick="reorderAnswer('${t.id}','${escapeHtml(a.url).replace(/'/g,"\\'")}',1)" ${i===(t.answers||[]).length-1?'disabled':''}>↓</button>
                                        <button class="key-delete" style="padding:2px 6px;font-size:11px" onclick="removeAnswer('${t.id}','${escapeHtml(a.url).replace(/'/g,"\\'")}')">✕</button>
                                    </div>
                                `).join('')}
                            </div>
                            <div style="font-size:12px;color:#484f58;margin-top:4px">
                                ${(t.sources || []).length > 0 ? 'Источники: ' + t.sources.map(s => '<a href="' + escapeHtml(s.url) + '" target="_blank" style="color:#58a6ff">' + escapeHtml(s.title || s.url) + '</a>').join(', ') : ''}

                            <button class="key-delete" style="background:#1f6feb" onclick="addAnswerToTrained('${t.id}')">+ URL</button>
                        </div>
                    </div>
                `).join('');
            } catch {}

                const data = await res.json();
                if (data.ok) await loadTrainedBingSA();
            } catch {}
        }

        async function removeAnswer(id, url) {
            try {
                const res = await fetch('/api/bingsa/remove-answer', {

                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },

                if (data.ok) await loadTrainedBingSA();

        async function addAnswerToTrained(id) {
            const url = prompt('Введите URL ответа:');
            if (!url) return;
            try {
                const res = await fetch('/api/bingsa/add-answer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },

        async function forgetBingSATrained(id, query) {
            if (!confirm('Забыть ответ на "' + query + '"?')) return;
            try {
                const res = await fetch('/api/bingsa/forget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ id })
                });
                const data = await res.json();
                if (data.ok) {
                    await loadTrainedBingSA();
                }

                if (data.error) { msg.textContent = data.error; msg.style.color = '#ff4b5c'; return; }

        let _selectedEmoji = null;
        let _selectedGradient = null;

        function initAvatarPicker() {
            const emojiGrid = document.getElementById('emojiGrid');
            const gradientGrid = document.getElementById('gradientGrid');
            const customInput = document.getElementById('customAvatarInput');
            if (!emojiGrid || !gradientGrid) return;
            _selectedEmoji = authUser.avatar_emoji || '😀';
            _selectedGradient = authUser.avatar_gradient || 'linear-gradient(135deg,#4facfe,#00f2fe)';
            if (customInput) customInput.value = _selectedEmoji;
            fetch('/api/avatars').then(r => r.json()).then(data => {
                const esc = s => s.replace(/'/g, "\\'");
                emojiGrid.innerHTML = data.emojis.map(e =>
                    `<span class="emoji-option${e===_selectedEmoji?' selected':''}" data-emoji="${esc(e)}" onclick="pickEmoji(this.dataset.emoji,this)">${e}</span>`
                ).join('');
                gradientGrid.innerHTML = data.gradients.map(g =>
                    `<span class="gradient-option${g===_selectedGradient?' selected':''}" data-gradient="${esc(g)}" onclick="pickGradient(this.dataset.gradient,this)" style="background:${g}"></span>`
                ).join('');
            });
        }

        function applyCustomAvatar() {
            const input = document.getElementById('customAvatarInput');
            const val = input.value.trim();
            if (!val) return;
            const chars = [...val].slice(0, 2).join('');
            _selectedEmoji = chars;
            document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            document.getElementById('avatarPreview').textContent = chars;
        }

        function pickEmoji(emoji, el) {
            _selectedEmoji = emoji;
            document.querySelectorAll('.emoji-option').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('avatarPreview').textContent = emoji;
            const input = document.getElementById('customAvatarInput');
            if (input) input.value = emoji;
        }

        function pickGradient(gradient, el) {
            _selectedGradient = gradient;
            document.querySelectorAll('.gradient-option').forEach(g => g.classList.remove('selected'));
            el.classList.add('selected');
            document.getElementById('avatarPreview').style.background = gradient;
        }

            try {
                const res = await fetch('/api/auth/profile', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + authToken },
                    body: JSON.stringify({ avatar_emoji: _selectedEmoji, avatar_gradient: _selectedGradient })

                authUser.avatar_gradient = data.avatar_gradient;

            const msg = document.getElementById('profileMsg');
            try {
                const res = await fetch('/api/friends/request', {

        async function loadFriendRequests() {
            const el = document.getElementById('friendRequestsList');
            if (!el) return;
            try {
                const res = await fetch('/api/friends/requests', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });
                const data = await res.json();
                let html = '';
                const incoming = data.incoming || [];
                const outgoing = data.outgoing || [];
                if (!incoming.length && !outgoing.length) {
                    el.innerHTML = `<p style="color:#8b949e">${t.friend_no_requests}</p>`;
                    return;
                }
                if (incoming.length) {
                    html += `<p style="color:#8b949e;margin-bottom:6px">${t.friend_incoming}</p>`;
                    incoming.forEach(r => {
                        html += `<div class="friend-request">
                            <span>👤 ${escapeHtml(r.from_username)}</span>
                            <button class="auth-btn-primary" style="padding:4px 12px;font-size:13px" onclick="acceptRequest('${r.id}')">✓</button>
                            <button class="key-delete" style="padding:4px 12px;font-size:13px" onclick="declineRequest('${r.id}')">✕</button>
                        </div>`;
                    });
                }
                if (outgoing.length) {
                    html += `<p style="color:#8b949e;margin:6px 0">${t.friend_outgoing}</p>`;
                    outgoing.forEach(r => {
                        html += `<div class="friend-request">
                            <span>👤 ${escapeHtml(r.to_username)} <span style="color:#8b949e;font-size:12px">${t.friend_pending}</span></span>
                            <button class="key-delete" style="padding:2px 8px;font-size:12px" onclick="cancelRequest('${r.id}')">${t.friend_cancel_btn}</button>
                        </div>`;
                    });
                }
                el.innerHTML = html;
            } catch { el.innerHTML = `<p style="color:#ff4b5c">${t.friend_error}</p>`; }
        }

        document.addEventListener('error', e => {
            const img = e.target;
            if (img.tagName === 'IMG' && img.dataset.fallback) {
                img.style.display = 'none';
                const fallback = document.createElement('div');
                fallback.className = 'partner-img-placeholder';
                fallback.textContent = img.dataset.fallback;
                img.parentElement.appendChild(fallback);
            }
        }, true);

        // ================== PWA / Install prompt ==================
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const banner = document.getElementById('installBanner');
            if (banner && !localStorage.getItem('installDismissed')) {
                banner.style.display = 'flex';
            }
        });
        document.getElementById('installBtn')?.addEventListener('click', async () => {
            const banner = document.getElementById('installBanner');
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const result = await deferredPrompt.userChoice;
                if (result.outcome === 'accepted') {
                    localStorage.setItem('installDismissed', '1');
                    if (banner) banner.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });
        document.getElementById('installDismiss')?.addEventListener('click', () => {
            localStorage.setItem('installDismissed', '1');
            document.getElementById('installBanner').style.display = 'none';
        });
        // Показать баннер если уже установлено как PWA
        if (window.matchMedia('(display-mode: standalone)').matches) {
            document.getElementById('installBanner')?.remove();
        }
    </script>
</body>
</html>
